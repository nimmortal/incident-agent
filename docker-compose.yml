services:
  incident-agent:
    build: .
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 20s
    env_file:
      - path: .env.local
        required: false
    volumes:
      - ./config/hermes.config.yaml:/app/config/hermes.config.yaml:ro
      - ./config/prompts:/app/config/prompts:ro
      - ./skills:/app/skills:ro
      - ./data:/app/data
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=64m
    command: ["npm", "run", "poll"]
